<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Use Poppins for a clean, modern UI with Inter as fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
  <nav>
    <div class="nav-container">
  <h2 class="nav-logo">Fuzzy Toolbox</h2>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/sets">Fuzzy Sets</a>

  <main class="main-container">
    {% block content %}{% endblock %}

<!-- MathJax Configuration and Loading -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
  // Reprocess MathJax when explanation content is loaded
  document.addEventListener('DOMContentLoaded', function() {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise().catch(function (err) {
        console.log('MathJax typeset error: ' + err.message);
      });
    }
    
    // Add loading indicator for explain buttons
    const explainButtons = document.querySelectorAll('button[name="explain"]');
    explainButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        // Create or show loading message
        let loadingDiv = document.getElementById('explanation-loading');
        if (!loadingDiv) {
          loadingDiv = document.createElement('div');
          loadingDiv.id = 'explanation-loading';
          loadingDiv.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:#fff; padding:2rem 3rem; border-radius:8px; z-index:9999; font-size:1.1rem; text-align:center;';
          loadingDiv.innerHTML = '<div style="margin-bottom:0.5rem;">⏳</div><div>Generating explanation...</div>';
          document.body.appendChild(loadingDiv);
        } else {
          loadingDiv.style.display = 'block';
        }
      });
    });
  });
</script>
</body>
</html>
